<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математический спринт</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: #fff;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 1rem;
            background: #f5f5f5;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .game-screen {
            padding: 2.5rem 1.5rem;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            display: none;
        }

        .btn {
            padding: 1rem 2rem;
            margin: 0.5rem;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-easy { background: #4caf50; color: white; }
        .btn-medium { background: #ff9800; color: white; }
        .btn-hard { background: #f44336; color: white; }

        .question {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-input {
            width: 200px;
            padding: 1rem;
            font-size: 1.8em;
            text-align: center;
            border-radius: 10px;
            border: 3px solid #667eea;
        }

        .feedback {
            min-height: 40px;
            margin-top: 1rem;
            font-size: 1.3em;
            font-weight: bold;
        }

        .correct { color: #4caf50; animation: bounce 0.4s; }
        .incorrect { color: #f44336; animation: shake 0.4s; }

        @keyframes bounce {
            50% { transform: translateY(-15px); }
        }

        @keyframes shake {
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .high-scores {
            margin-top: 2rem;
            width: 100%;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            background: #f5f5f5;
            padding: 0.6rem;
            border-radius: 5px;
            margin-bottom: 0.4rem;
        }

        @media (max-width: 600px) {
            .question { font-size: 2.2em; }
            .answer-input { width: 150px; font-size: 1.4em; }
        }
    </style>
</head>

<body>
<div class="game-container">

    <div class="game-header">
        <h1>🧮 Математический спринт</h1>
        <p>Решай примеры на скорость и набирай очки</p>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-label">Очки</div>
            <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Время</div>
            <div class="stat-value" id="timer">60</div>
        </div>
        <div class="stat">
            <div class="stat-label">Streak</div>
            <div class="stat-value" id="streak">0</div>
        </div>
    </div>

    <!-- Старт -->
    <div id="startScreen" class="game-screen">
        <h2>Выберите сложность</h2>
        <button class="btn btn-easy" onclick="startGame('easy')">Лёгкий</button>
        <button class="btn btn-medium" onclick="startGame('medium')">Средний</button>
        <button class="btn btn-hard" onclick="startGame('hard')">Сложный</button>

        <p style="margin-top:1rem;">
            Цель: решить как можно больше примеров за отведённое время.
        </p>

        <div class="high-scores" id="highScoresStart"></div>
    </div>

    <!-- Игра -->
    <div id="gameScreen" class="game-screen hidden">
        <div class="question" id="question"></div>
        <input type="number" id="answerInput" class="answer-input" placeholder="?" autofocus>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- Результаты -->
    <div id="resultsScreen" class="game-screen hidden">
        <h2>Игра окончена</h2>
        <h1 id="finalScore">0</h1>
        <p>Правильных: <b id="correct"></b></p>
        <p>Ошибок: <b id="wrong"></b></p>
        <p>Точность: <b id="accuracy"></b></p>
        <p>Лучший streak: <b id="bestStreak"></b></p>

        <button class="btn btn-easy" onclick="resetGame()">Играть снова</button>

        <div class="high-scores" id="highScoresEnd"></div>
    </div>
</div>

<script>
    let score = 0, streak = 0, bestStreak = 0;
    let correct = 0, wrong = 0;
    let timeLeft = 60, timer;
    let answer = 0;

    const levels = {
        easy: { min: 1, max: 10, time: 60 },
        medium: { min: 10, max: 50, time: 60 },
        hard: { min: 50, max: 100, time: 90 }
    };

    window.onload = () => showScores("highScoresStart");

    function startGame(level) {
        score = streak = bestStreak = correct = wrong = 0;
        timeLeft = levels[level].time;

        document.getElementById("startScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");

        updateStats();
        nextQuestion(level);
        timer = setInterval(tick, 1000);
    }

    function nextQuestion(level) {
        const cfg = levels[level];
        const a = rand(cfg.min, cfg.max);
        const b = rand(cfg.min, cfg.max);
        const ops = ["+", "-", "*"];
        const op = ops[rand(0,2)];

        if (op === "+") answer = a + b;
        if (op === "-") answer = Math.abs(a - b);
        if (op === "*") answer = rand(1,10) * rand(1,10);

        document.getElementById("question").textContent = `${a} ${op} ${b} = ?`;
        document.getElementById("answerInput").value = "";
        document.getElementById("feedback").textContent = "";
    }

    function tick() {
        timeLeft--;
        updateStats();
        if (timeLeft <= 0) endGame();
    }

    function updateStats() {
        score >= 0 && (document.getElementById("score").textContent = score);
        document.getElementById("timer").textContent = timeLeft;
        document.getElementById("streak").textContent = streak;
    }

    document.getElementById("answerInput").addEventListener("input", function() {
        if (parseInt(this.value) === answer) {
            correct++;
            streak++;
            bestStreak = Math.max(bestStreak, streak);
            score += 10 + streak * 2;
            document.getElementById("feedback").textContent = "Верно!";
            document.getElementById("feedback").className = "feedback correct";
            nextQuestion("easy");
        }
    });

    function endGame() {
        clearInterval(timer);
        saveScore(score);
        document.getElementById("gameScreen").classList.add("hidden");
        document.getElementById("resultsScreen").classList.remove("hidden");

        document.getElementById("finalScore").textContent = score;
        document.getElementById("correct").textContent = correct;
        document.getElementById("wrong").textContent = wrong;
        document.getElementById("accuracy").textContent =
            Math.round(correct / Math.max(1, correct + wrong) * 100) + "%";
        document.getElementById("bestStreak").textContent = bestStreak;

        showScores("highScoresEnd");
    }

    function resetGame() {
        document.getElementById("resultsScreen").classList.add("hidden");
        document.getElementById("startScreen").classList.remove("hidden");
        showScores("highScoresStart");
    }

    function saveScore(value) {
        const scores = JSON.parse(localStorage.getItem("mathScores") || "[]");
        scores.push({ value, date: new Date().toLocaleDateString() });
        scores.sort((a,b)=>b.value-a.value);
        localStorage.setItem("mathScores", JSON.stringify(scores.slice(0,5)));
    }

    function showScores(id) {
        const scores = JSON.parse(localStorage.getItem("mathScores") || "[]");
        let html = "<h3>🏆 Рекорды</h3>";
        scores.forEach((s,i)=>{
            html += `<div class="score-item"><span>${i+1}. ${s.value}</span><span>${s.date}</span></div>`;
        });
        document.getElementById(id).innerHTML = html;
    }

    function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
</script>
</body>
</html>
